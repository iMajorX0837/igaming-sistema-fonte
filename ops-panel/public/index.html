<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venuz Ops</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="header">
        <div>
          <h1>Venuz Ops</h1>
          <p>Painel da VPS — deploy e restart das casas</p>
        </div>
        <div class="header-actions">
          <button id="btn-refresh" class="btn btn-ghost">Atualizar</button>
          <button id="btn-deploy-all" class="btn btn-primary">Deploy das 2 casas</button>
        </div>
      </header>

      <section id="job-box" class="job-box hidden">
        <div class="job-head">
          <div class="job-head-left">
            <strong id="job-label">Operação</strong>
            <span id="job-status" class="badge">...</span>
          </div>
          <button id="btn-stop-live" class="btn btn-stop btn-sm hidden" type="button">Parar logs</button>
        </div>
        <pre id="job-output" class="log log-live"></pre>
      </section>

      <section id="tenants" class="tenants"></section>

      <section class="panel">
        <h2>Log global</h2>
        <pre id="global-log" class="log"></pre>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
